[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sunshine-centralizer-sim"
version = "0.5.0"
description = "Unvalidated centralizer placement engineering prototype"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2", "plotly>=5.24,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
sunshine_sim = ["data/examples/*.json"]
